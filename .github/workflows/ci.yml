name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:  # manual "Run workflow" — requires write access (owner-only)
  # NOTE: no `pull_request` trigger. This is a PUBLIC repo; every trigger above
  # requires write access, so a fork can never cause code here to execute.
  # NOTE: no `schedule` trigger either. A nightly cron once fired the live jobs
  # unattended (on a schedule event `github.ref` is refs/heads/main, so a ref gate
  # passes too), spending the maintainer's model quota mid-workday.

# The repo default is already `read`; stating it means a future change to that
# default cannot silently widen what a workflow run can do.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, compile, knowledge bundle
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to 40-char commit SHAs, not tags. A tag is mutable by
      # anyone with write access to the action's repo — the mechanism of
      # CVE-2025-30066 (tj-actions/changed-files, March 2025), which rewrote every
      # version tag to a malicious commit and exfiltrated secrets through the log.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        # `dev` is an extra, not a PEP 735 group, so `.[dev]` installs pytest and
        # ruff. GPU wheels install fine CPU-side; only runtime needs CUDA.
        run: pip install -e ".[dev]" --quiet

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Compile check
        run: python -m compileall -q src/coderag

      # Must be >= okfrules' go.mod minimum: setup-go sets GOTOOLCHAIN=local, so `go install`
      # cannot fetch a newer toolchain and fails outright rather than adapting.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.26"

      # Pinned: `@latest` lets this gate's verdict change with no commit in this repo.
      - name: Install okfrules
        run: go install github.com/fairyhunter13/okf/cmd/okfrules@v0.4.1

      # Here rather than in the unit job, which is the only place the checker is
      # installed. These tests shell out to it and fail closed when it is
      # absent -- correctly, and that is what turned the unit lane red.
      - name: Knowledge bundle conformance
        run: pytest tests/test_okf_bundle.py -q

      # Not `continue-on-error`. The bundle is clean under -Werror today, and a
      # gate whose failure is swallowed reports the same green as a passing one.
      - name: Knowledge bundle warnings
        run: okfrules check -Werror knowledge

  test:
    name: Unit tests (no GPU, no daemon)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]" --quiet

      # CODERAG_NAME_BAN=none is deliberate and is not a skip. Five of the seven
      # tests in test_public_hygiene.py need no ban list and run for real here,
      # including the one asserting that an *unset* list fails rather than standing
      # down. The literal-name sweep is not moved into a repo secret because the
      # test reports its matches — the banned terms themselves — into a log that is
      # public on this repo, and because CI runs after the push, by which time the
      # content is already published. That gate's only useful home is pre-push.
      - name: Tests
        env:
          CODERAG_NAME_BAN: none
        # The bundle tests are the `quality` job's, where `okf` exists.
        run: >-
          pytest -m "not gpu and not live and not restart" --ignore=tests/test_okf_bundle.py
          -q --strict-markers --strict-config -ra

# NOTE: there are no GPU or live jobs here, and that is deliberate.
# They used to run `runs-on: self-hosted` against the maintainer's workstation.
# GitHub's own guidance is that self-hosted runners "should almost never be used
# for public repositories", and the mitigation it recommends — runner groups — is
# unavailable on a personal account. The actor/ref/repository `if:` gates were
# doing that job, correctly, but one workflow edit away from not being true, on a
# machine holding SSH keys and a private client index. The runner is deregistered
# and `-m gpu`, `-m live` and `-m restart` run from the shell, which was already
# the daily workflow.
