# Self-heal: recover from clean/graceful stops that Restart=on-failure ignores.
#
# Root cause (2026-07-22): a `POST /api/reload` on 2026-07-21 13:07 shut the daemon
# down via SIGTERM (graceful). systemd treats SIGTERM as a *clean* stop, so the base
# unit's `Restart=on-failure` did NOT bring it back, and the MCP server sat dead for a
# day+ (unavailable in every project / Claude Code session).
#
# Restart=always recovers from any process exit or signal EXCEPT an explicit
# `systemctl --user stop`. So to intentionally keep the daemon down, use
# `systemctl --user stop rag-search-mcp-daemon` (not `daemon stop` / reload?restart=false,
# which will now auto-recover in ~3s).
#
# No flap risk from the idle self-exit: check_idle_shutdown() calls sys.exit(0) inside
# the scheduler's background thread, where SystemExit cannot terminate the process, so it
# never actually exits — Restart=always has nothing to loop on there.
[Service]
Restart=always
RestartSec=3s
