# Periodic reconcile. Permanent — split out of vector-migration.conf when that file
# was deleted (change 7, 2026-07-28), because the two settings it carried stopped
# having the same lifetime.
#
# vector-migration.conf turned the resync on "only for the duration of the migration"
# and said to remove it at convergence, on the reasoning that steady state is
# watcher-driven and a converged pass is pure overhead. That reasoning was correct
# when it was written and is no longer, because reconcile acquired a second job the
# same day the migration converged.
#
# _vectors_content_stale (sweeps.py, the W3 trigger) re-embeds files whose mtime is
# newer than the stored vectors, independent of embed_signature. It exists because
# reconcile re-derived the *graph* on mtime drift while only re-embedding on
# *signature* drift, so a project whose watcher stream went quiet kept a maintained
# graph over vectors from months earlier and reported itself healthy — the failure
# that surfaced as `search` answering from a deleted revision of fulfillment.go.
#
# That trigger is the safety net for a watcher gap. server.py::_reconcile_loop parks
# on an Event forever when this is 0, so without it the net is checked once per
# daemon boot — and this daemon routinely runs for days. A safety net that only fires
# on restart catches nothing that a restart would not already have fixed.
#
# 1800s is carried over unchanged rather than re-picked: it is the interval the fleet
# has actually been running under, so it is the one value with evidence behind it.
# A converged pass is cheap — each project checks a signature and an mtime and skips —
# and the loop that made it expensive (community_count()==0 forcing a full re-index on
# every pass, forever, for the 12 projects whose extractor yields no symbols) was fixed
# in the same restart that deployed this.
[Service]
Environment=RSE_RECONCILE_RESYNC_S=1800
