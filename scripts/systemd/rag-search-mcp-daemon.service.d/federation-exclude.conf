# Repos excluded from RSE federation discovery + reconcile indexing.
# RSE_FEDERATION_EXCLUDE is honored by discover_members() and reconcile_projects().
# These repos are never registered, federated, indexed, or BPRE-swept by the daemon.
#
# */_worktrees/* excludes linked `git worktree` checkouts (2026-07-30). They are not
# a distinct source of truth: `git worktree list` showed the main checkout and the
# worktree at the SAME commit (e.g. <repo>, both at one commit), so every chunk in
# them was a second copy of a chunk already indexed under the main checkout. 58 of
# the largest workspace's 193 federation members were worktrees, carrying 541,718 chunks
# = 24.8% of the 2,188,697 the daemon scans on every federated query, at a
# CPUQuota of one core. Excluding is the whole fix: discover_members() drops them
# from the walk, index_members() then rewrites root.federation without them and
# disables the stale member entries. Deleting registry rows alone would NOT hold --
# the next member-discovery sweep re-derives the list from the symlinks and
# overwrites it.
# Verified against is_federation_excluded(): matches .../_worktrees/<name>, does
# not match the main checkout .../<repo> or any unrelated project.
#
# Host-specific repo exclusions are appended to the same value, os.pathsep-separated,
# as absolute paths -- systemd expands %h inside Environment= in a drop-in file (probed
# 2026-07-30; note it does NOT expand for `systemd-run -p Environment=`), so write them
# as %h/... and keep this file device-neutral (HR34). This host also carries an
# %h/git/github.com/<owner>/<repo> entry, which has no registry row and so is
# not load-bearing for anything the suite checks.
#
# The glob is what test_fe10_armed_disabled_rows_are_covered_by_the_exclusion depends on:
# 58 disabled rows have indexed_at=None, so _needs_index() is True for every one and
# register_all_members() re-enables any member discovery still finds. Drop the glob and
# that gate goes red -- which is the only reason losing this file is now noticeable.
[Service]
Environment=RSE_FEDERATION_EXCLUDE=*/_worktrees/*
