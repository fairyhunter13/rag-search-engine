# Dashboard chat: Claude Code (claude-haiku-4-5) only — codex support removed.
# Pins the model against a stale RSE_QUERY_LLM_MODEL inherited from the shell session.
# An RSE_QUERY_LLM_PROVIDER=claude line stood here until 2026-07-31 and pinned nothing: no code
# ever read that variable, so the guarantee it looked like it made was made by HR10 alone —
# routes_chat.py can only shell out to `claude -p`. The model is the only part that varies.
[Service]
Environment=RSE_QUERY_LLM_MODEL=claude-haiku-4-5
