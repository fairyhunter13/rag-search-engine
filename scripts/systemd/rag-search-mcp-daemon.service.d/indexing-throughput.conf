# Indexing throughput. Permanent — deliberately NOT in vector-migration.conf, which
# gets deleted once the fleet converges (change 7). Putting these there would silently
# revert the batch size at the exact moment nobody is watching for it.
#
# RSE_EMBED_BATCH: config.embed_batch_size() was a flat 8 on a 16 GB card with ~9.8 GB
# free; fastembed's own default is 256. Batch size is the multiplier on the two costs
# that dominated the July-2026 fleet migration, because both are paid *per batch*:
#   - indexer._thermal_pace samples the GPU once per batch (a 128k-chunk project armed
#     that gate ~16,000 times at 8, ~4,000 at 32)
#   - fastembed pools token embeddings in numpy, paying fixed per-call overhead on
#     arrays 4x smaller than they need to be
# Pinned rather than left to the VRAM ladder because free VRAM fluctuates around the
# 9 GB rung, and a batch size that silently changes between runs makes throughput
# measurements unreproducible. 32, not 256: attention is quadratic in the 768-token
# sequence, and this repo's own 768-vs-1024 token-budget result is standing proof
# that "bigger is better" does not transfer between knobs. Re-measure before raising.
#
# MemoryHigh 3G -> 4G: index_project holds an entire project's chunks and vectors in
# RAM before store.clear(), so peak scales with the largest repo, not with the daemon's
# steady state. Measured 2026-07-28: MemoryCurrent 2,967,093,248 and MemoryPeak
# 3,225,088,000 against a 3 GiB MemoryHigh — already past the throttle point, with
# memory.events high=7522 and oom_kill=0. That is sustained reclaim pressure, not a
# failure, and it predates the batch-size change. MemoryMax stays 6G as the real limit.
# The structural fix is streaming index_project (planned); this is the interim.
[Service]
Environment=RSE_EMBED_BATCH=32
MemoryHigh=4G
