# MemorySwapMax=0 — the last live piece of #22, and it is a preference, not a free win.
#
# MemoryHigh=4G (indexing-throughput.conf) and MemoryMax=6G already bound the daemon; what
# was still unbound is what happens *between* them. A spike past 4 GiB currently degrades
# into swap, where the daemon keeps answering, slowly, with no signal that says so — a
# 1.5 GB resident embedder paged out mid-sweep looks like an unrelated latency problem and
# nothing in /healthz names it. With swap denied, that same spike is an OOM kill, and
# Restart=always brings the daemon back in ~1 s.
#
# The trade, stated plainly: a class of silent degradation becomes a loud restart, paid for
# with one cold GPU start. That matches the same doctrine as GPU-only (HR6) — a CPU fallback
# must raise rather than quietly degrade — and it is the reason to set it, not a measurement.
# There is no throughput claim here and none should be inferred.
#
# OOMPolicy=stop is already set, so the kill stops the unit rather than the whole slice.
[Service]
MemorySwapMax=0
