# Scenarios the conformance suite runs that this server does not implement.
#
# The suite has no capability-aware skipping: it runs its whole active set, so a
# server with two tools and no prompts, resources, sampling, elicitation or
# logging fails 21 of 30 by construction. Every entry below is a feature
# deliberately absent -- `tools.py` registers two tools and nothing else.
#
# This is not a mute. The run exits non-zero on a failure that is *not* listed,
# and also on a listed scenario that starts passing, so the list cannot rot in
# either direction.
server:
  # Warns rather than fails, and the baseline check counts a warning: the
  # scenario needs a session id to open a second stream against, and this
  # server is stateless on purpose.
  - server-sse-multiple-streams
  - logging-set-level
  - completion-complete
  - tools-call-image
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-mixed-content
  - tools-call-with-logging
  - tools-call-with-progress
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - resources-subscribe
  - resources-unsubscribe
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
