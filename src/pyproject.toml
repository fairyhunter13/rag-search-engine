[project]
name = "rag-search"
version = "0.2.0"
description = "GPU-accelerated local semantic code search engine"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rag-search Team" }]

dependencies = [
    # GPU-accelerated embeddings and reranking
    "fastembed-gpu>=0.4.0",
    "onnxruntime-gpu[cuda,cudnn]>=1.24.0",

    # Chunking: code (tree-sitter), semantic, token
    "chonkie[code,semantic]>=1.5.0",

    # Seven dependencies left here, and none of them was a DeepSeek dep — graph/llm.py
    # spoke to DeepSeek over plain urllib, so tier 3 took no third-party client with it.
    # What the audit found instead is that all seven had ZERO import sites anywhere in
    # src/ (kb/ included) and nothing else in the venv requires them:
    #   openai                  claimed by comment to be pulled in by chonkie's embedding
    #                           registry "even for local-only paths" — chonkie imports it
    #                           only under genie/ and embeddings/azure_openai, which the
    #                           CodeChunker path never touches
    #   anthropic               commented "dashboard chat haiku fallback"; that lane is a
    #                           `claude -p` subprocess and core/claude_profiles.py talks to
    #                           the usage endpoint over urllib. An unused generative SDK is
    #                           exactly what R0 exists to take out
    #   langchain-text-splitters, beautifulsoup4, lxml   a trio: the latter two are imported
    #                           only BY langchain_text_splitters, which nothing imports
    #   cachetools              nothing in src/ or site-packages imports it
    #   leidenalg               dead and actively forbidden — test_schema_consistency.py's
    #                           SC8a asserts community.py must not import it (k-core replaced
    #                           Leiden). Note for anyone reading the plan: community labelling
    #                           is k-core, not Leiden
    # Measured rather than reasoned: re-run of chunk_file over python/markdown/html with all
    # seven blocked by a meta-path finder that raises ImportError. That is the discriminating
    # form — a bare "the daemon still starts" would pass on a lazily-imported dependency.

    # Parsing
    "pyyaml>=6.0.0",

    # Vector database (sqlite-vec: flat ANN, perfect recall, unified store)
    "sqlite-vec>=0.1.0",

    # File watching (Rust `notify` backend: one thread/inotify-instance for all
    # watched roots, Rust-side event coalescing — see daemon/watcher.py)
    "watchfiles>=1.0.0",

    # Gitignore matching
    "pathspec>=0.12.0",

    # Result and model caches
    "cachetools>=5.3.0",

    # VRAM watchdog (nvidia-ml-py is the maintained successor to the deprecated pynvml package)
    "nvidia-ml-py>=12.0.0",

    # MCP stdio server
    "mcp>=1.0.0",

    # CLI
    "typer>=0.9.0",

    # Process utilities
    "psutil>=5.9.0",

    # Structural code graph: AST extraction.
    # S3: the pack is pinned, not floored. Its grammars are a direct input to what extraction
    # emits, so a silent upgrade would change every stored graph with no EXTRACTOR_REV bump to
    # invalidate them — the fleet would keep serving edges no current code would produce.
    # Raise the pin and the REV together, deliberately.
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack==1.14.0",

    # Community detection (k-core over igraph — see the leidenalg note above)
    "igraph>=0.11.0",
]

[project.optional-dependencies]
browser = [
    # Headless browser for Playwright UI tests
    "playwright>=1.44",
    "pytest-playwright>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",

    "ruff>=0.6.0",
    "mypy>=1.11.0",

    # The instrument for consolidating the live suite. Merging N per-test corpora into one
    # shared fixture is the move that loses coverage quietly: "the suite got faster" and "I
    # deleted assertions" produce the same wall clock. The gate is a set difference over
    # covered lines, before and after — never a percentage, which holds flat while the lines
    # underneath it move. No test may import this; it wraps the run from outside, so it does
    # not touch the no-mock invariant.
    "coverage>=7.6.0",

    # Sampling profiler. It is the only oracle for the daemon's threads (Python thread
    # names are not exported to the OS here), has been the instrument behind every
    # CPU/latency diagnosis in this repo, and until now lived in .venv/ without being
    # declared — so a fresh checkout could not reproduce any of those measurements.
    "py-spy>=0.3.14",
]

[project.scripts]
rag-search = "rag_search.cli:app"
rag-search-index = "rag_search.cli:rse_index_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_search"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line too long — typer help strings are unavoidably long
    "B008",   # typer.Option/Argument in default args is the intended typer API
    "RUF002", # × (MULTIPLICATION SIGN) in docstrings is intentional math notation
    "RUF001", # en-dash/em-dash in JS strings embedded in Python raw strings
    "RUF003", # ambiguous characters in comments (mathematical notation)
    "N806",   # _UPPER_CASE local constants in functions are intentional convention
    "N814",   # CamelCase imported as _lower alias (e.g., ElementTree as _ET)
]

[tool.ruff.lint.per-file-ignores]
# Six entries left with tier 3 (the four kb/bpre_*.py modules, test_bpre_processes.py,
# test_okf.py). ruff does not warn about a per-file-ignore naming a file that no longer
# exists, so these are the same silent stale-allowlist hole R0 has now found repeatedly —
# pruned by hand here because nothing checks them.
"rag_search/embed/embedder.py" = ["E402"]  # ONNX arena env must be set before fastembed import
"tests/live/test_feature_proof.py" = ["E401", "E702", "E701", "I001"]  # ultra-compact 150-line budget (WS-F/G)
"rag_search/index/bounded_parse.py" = ["E401", "E702", "I001"]  # ultra-compact 150-line budget

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "rag_search.core.*",
    "rag_search.index.*",
    "rag_search.graph.*",
    "rag_search.query.*",
    "rag_search.server.*",
    "rag_search.daemon.*",
    "rag_search.cli",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["rag_search.embed.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/tests"]
markers = [
    "live: requires daemon at :8765, CUDA GPU — hard-fails if daemon/GPU absent (never skipped)",
    # `slow` used to mean both of the below at once, and that conflation is what rotted gates.
    # Measured 2026-07-30: of 47 `slow` tests only 13 reached a model and 3 needed a quiet daemon.
    # The other 31 cost wall clock alone, yet one `-m 'not slow'` excluded all 47 from every push —
    # so a third of the suite ran only on a manual dispatch nobody dispatches. Six gates rotted in
    # one week behind that mark. Two narrow reasons replace one broad one.
    "costly: spends real Claude session quota (`claude -p` via /api/chat_stream) — dispatch only",
    "exclusive: needs a quiescent daemon to measure it (CB3/CB4/CB6) — never beside other load",
]
