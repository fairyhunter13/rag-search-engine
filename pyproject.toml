[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coderag"
version = "0.1.0"
description = "Hybrid code retrieval over a symlink-federated project tree, served as two MCP tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # onnxruntime-gpu, never onnxruntime: the CPU wheel exports a
    # CUDAExecutionProvider name that resolves to CPU, which is the one failure
    # gpu.py exists to make impossible.
    #
    # Pinned and extra'd, both deliberately. `>=1.26` with no extras left the
    # CUDA runtime ambient rather than declared, and ORT's own build moved from
    # CUDA 12 to CUDA 13 at exactly 1.27 -- so the resolver walked forward while
    # the cu12 wheels stayed, and every session loaded on CPU.
    "onnxruntime-gpu[cuda,cudnn]==1.29.*",
    "tokenizers>=0.23",
    "numpy>=2.0",
    "huggingface-hub>=1.0",
    # The per-project config format. Already present transitively via
    # huggingface-hub, and declared anyway: a library this imports directly
    # is one that has to survive a dependency dropping it.
    "pyyaml>=6.0",
    # sqlite3 comes from the stdlib.
    "sqlite-vec>=0.1.9",
    # Pinned for the same reason onnxruntime-gpu is: `>=1.27` resolved to 2.0.0,
    # where FastMCP is renamed MCPServer and the old import path is simply gone.
    "mcp==2.0.*",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "watchfiles>=1.0",
    # The splitter. Rust, MIT, zero transitive dependencies, and it returns each
    # chunk with its offset -- which is what makes a line range a newline count
    # rather than a re-derivation this engine would have to guess at.
    "semantic-text-splitter>=0.32,<0.33",
]

[project.scripts]
coderag = "coderag.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/coderag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ARG", "PTH", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "T20"]
"scripts/*" = ["T20"]
"src/coderag/cli.py" = ["T20"]
"src/coderag/systemd.py" = ["T20"]
# The bridge's only channel to a human is stderr: stdout carries framed
# JSON-RPC, so a logger writing there would desynchronise the client.
"src/coderag/bridge.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: needs the real GPU and the real models",
    "live: needs the running daemon and the real fleet; never runs in parallel",
    # Separate from `live` because tests/live.py refuses to start or stop the daemon
    # on purpose -- starting one there would hide the unit. A restart test needs the
    # opposite permission, so it gets its own marker rather than weakening that rule.
    "restart: kills and restarts a daemon of its own; needs the GPU, not the unit",
]
