[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coderag"
version = "0.1.0"
description = "Hybrid code retrieval over a symlink-federated project tree, served as two MCP tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # onnxruntime-gpu, never onnxruntime: the CPU wheel exports a
    # CUDAExecutionProvider name that resolves to CPU, which is the one failure
    # gpu.py exists to make impossible.
    "onnxruntime-gpu>=1.26",
    "tokenizers>=0.23",
    "numpy>=2.0",
    "huggingface-hub>=1.0",
    # sqlite3 and tomllib come from the stdlib.
    "sqlite-vec>=0.1.9",
    "mcp>=1.27",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "watchfiles>=1.0",
]

[project.scripts]
coderag = "coderag.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/coderag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ARG", "PTH", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "T20"]
"src/coderag/cli.py" = ["T20"]
"src/coderag/systemd.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: needs the real GPU and the real models",
    "live: needs the running daemon and the real fleet; never runs in parallel",
]
